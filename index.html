<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗罗人生模拟器</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <div class="container">

        <h1>斗罗人生模拟器</h1>

        <p class="subtitle">
            在斗罗大陆，开启属于你的人生。
        </p>

        <button id="newGameBtn">
            开始新人生
        </button>

        <button id="continueBtn" disabled>
            继续游戏
        </button>

        <button id="settingBtn">
            设置
        </button>

        <section id="gameArea" style="display: none;">
            <p id="playerName"></p>
            <p id="playerAge"></p>
            <div id="playerStats" class="player-stats"></div>

            <h2 id="eventTitle"></h2>
            <p id="eventText"></p>

            <h3>人生记录</h3>
            <ul id="historyList"></ul>

            <button id="nextYearBtn">
                继续成长
            </button>
        </section>

        <footer>
            v0.0.1 Alpha
        </footer>

    </div>

   <script type="module" src="js/app.js"></script>

</body>

</html>
